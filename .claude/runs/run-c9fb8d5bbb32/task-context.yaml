objective: 'Give the framework a closed knowledge loop, so that what one run learns the hard way reaches the agents of later
  runs without an operator carrying it by hand. Today the loop is open: Every rejected artifact is recorded (validation_failed
  events in runs/<run>/events.jsonl, each naming the failing check IDs; 29 across 24 runs on disk). Gate rejections and rollbacks
  are recorded too (rollback_scheduled events, gate-rejection entries in recovery-ledger.json). None of that reaches a later
  dispatch. Every invocation envelope carries memory_slice: {hydrated: false, reason: "memory hydration not requested by this
  run"}, and the context slice excludes memory/. memory/memory-resolver.md and config/...'
