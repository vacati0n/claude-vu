objectives:
- 'Harvest is deterministic and idempotent: one lesson per fingerprint, and unchanged evidence yields a byte-identical store.
  Verified by AC-002, AC-005, AC-006...'
- A lesson record carries only its declared fields, so free text from evidence never reaches the store or a prompt. Verified
  by AC-004 and the review in T-019....
- Eligibility is a function of lesson status, distinct-run count, and a configured threshold alone. Verified by AC-011, AC-012,
  AC-013. Traces to business obje...
- Recall is phase-scoped, capped at five, ordered by distinct-run count with deterministic ties, and renders a bounded prompt
  section. Verified by AC-014, AC-0...
- Dispatch output and idempotency key are unchanged for runs planned before the change and for runs whose plan switches hydration
  off. Verified by AC-018, AC-0...
- Harvest runs on run aggregation and tolerates a repository without a runs directory. Verified by AC-021, AC-003. Traces
  to business objective 1 and to S-012,...
- Effectiveness accounting attributes each later recurrence to the dispatches that were shown the lesson, and metrics record
  the hydrated count. Verified by AC...
- The lesson store is unaffected by the memory optimization tool. Verified by AC-009. Traces to business objective 2 and to
  S-031.
- The change uses no model call and no dependency beyond the standard library, and alters no gate, validator, artifact contract,
  Phase Model table, or agent mo...
- 'Desired outcome: Recorded run evidence becomes governed lessons that later dispatches of the matching phase receive as
  data, while every run planned before t...'
- 'Architectural objectives:'
- One new runtime boundary, runtime/knowledge.py, owns harvest, store, governance, eligibility, recall selection, and effectiveness
  accounting, depends only on...
- A deterministic, governed lesson store contract lives under memory/, outside the memory optimizer's scan and outside the
  shipped payload (S-002, S-003, S-004...
- A run-level hydration record is fixed once at plan time in run state, and an absent record means a pre-change run that never
  hydrates (S-011, S-029, S-032).
- Lessons reach a dispatch only through memory_slice, an optional bounded prompt section, and one invocation_started detail
  key, none of which enters the paylo...
- Harvest attaches to run aggregation as an isolated post-step that cannot fail or alter aggregation (S-010, S-034).
- Effectiveness and per-invocation counts derive from append-only invocation evidence (S-008, S-009).
- Governance actions are operator commands over an append-only history, and nothing is deleted (S-005, S-006, S-018).
- 'In scope: harvest, store, governance, eligibility, recall at dispatch, run-level record and plan flag, aggregation hook,
  effectiveness report, metrics count,...'
- 'Out of scope:'
- Model calls, embeddings, vector stores, network access (S-020; X-001).
- Automatic change to validators, templates, gate rules, or agent module text from a lesson (S-020; X-002).
- Evidence sources other than recorded run evidence (S-020; X-003); approval waits as lessons (S-023; X-004).
- Hydrating or backfilling runs planned before the change (S-011; X-005).
- Any change to gates, validators, artifact contracts including the execution-plan contract, Phase Model tables, or agent
  module text (S-013, S-032; X-006).
- Automatic retirement, deletion of lesson records, graphical reporting (S-006; X-007, X-008, X-009).
- Any edit to a context-slice member file, including runtime/README.md and the registries (S-026, S-030).
- Any change to context_slice content or to input_contract for any run (S-030).
- Incremental harvest; deferred until evidence shows the full harvest is too costly (S-010).
