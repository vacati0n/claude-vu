objective: 'python .claude/runtime/verify_self_hosting.py --release-checklist is the command every framework change must pass
  (CLAUDE.md, validation/framework-release-checklist.md). Running it on a clean checkout leaves the working tree dirty: committed
  run evidence under .claude/runs/ is rewritten in place. Contributors therefore run the checklist on a temporary copy of
  the tree so that they do not commit, or have to revert, changes to a past run. An independent review recorded this as DF-001.
  DF-001 (medium, always): after python .claude/runtime/verify_self_hosting.py --release-checklist on a clean checkout, git
  status --short reports M .claude/runs/run-c5a8d50d3238/state.json and M .claude/runs/ru...'
