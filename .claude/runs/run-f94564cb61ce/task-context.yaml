objective: omn-documentation is registered to own documentation-and-release-handoff, the last phase of implement-feature.
  That phase declares its inputs as "verification report, change summary" on the release-handoff communication basis and has
  no deployment step. Deployment belongs to the separate release workflow. The agent's release-verdict contract, however,
  only describes deployment outcomes. A handoff whose change has been verified in the run's working tree but not deployed
  has no truthful verdict that the validator accepts, so the phase cannot produce a passing artifact without misstating what
  happened, and an implement-feature run cannot close honestly. agents/omn-documentation/reasoning.md,...
