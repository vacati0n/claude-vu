  phases, the runtime offers the upstream artifact to the next agent under the producing agent's own output identifier, and
  the consuming agent's manifest does not list that identifier as an accepted input. The next phase then blocks at guard G5-INPUT
  with "no accepted input type supplied". The same agents own the phases of the research workflow, which is expected to fail
  the same way. Separately, the self-hosting profile routes /investigate with an input type that no agent declares. runtime/framework_runtime.py,
  function upstream_inputs, offers each completed upstream arti...
