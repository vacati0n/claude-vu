objective: 'Operator request, 2026-09-08, extended 2026-09-12 and 2026-09-14. Type: capability addition. Priority: High —
  the capability exists to support a live product presentation, and the framework had no way to show itself working. The framework
  can execute a governed multi-agent run but cannot show one. Explaining it to someone who has not seen it means talking over
  a state table. Add a capability by which a run records itself and produces a distribution-ready demonstration film with
  no human editing step, so that a presenter has evidence rather than assertions. Three deliverables, in the order they were
  asked for: 1. /implement --demo. An optional flag on the existing command that turns on rec...'
