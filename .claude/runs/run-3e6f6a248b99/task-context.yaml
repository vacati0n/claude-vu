objective: 'The runtime classifies a gate rejection as a rollback (failure-classification matrix row "Gate rejection | gate
  state | rollback | blocker marked unresolved", config/execution-engine.md; runtime/recovery_policy.py lines 104-109), and
  every workflow specification''s Failure Recovery section promises the corresponding return — for example workflows/implement-feature.md:
  "Return to implementation stage when review or QA fails." Nothing executes that rollback. After a rejection the gate work
  item is failed, the phase it closes stays completed, every downstream phase is blocked by guard G4-GATE with reason awaiting_recovery_task,
  and no runtime command can move any of them. The run can never'
