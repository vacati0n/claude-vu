  in the dispatch envelope the runtime hands to the host. Today all twelve agent entrypoints declare model: inherit, the envelope
  has no model field, and every phase therefore runs on whatever model the operator''s session happens to use, however light
  the phase is. A single implement-feature run costs about 510K estimated context tokens across nine agent invocations. Runtime
  0.7 cut what each agent reads. It did nothing about which model reads it. Several phases are read-and-summarise work (scope
  definition, technical discovery, documentation hand-off, artifact packaging, reposi...'
