objective: runtime/verify_recovery.py check X1 judges every open failure envelope's clearing action through clearing_action_admissible.
  A placeholder in angle brackets is not executable, so the table rejects any placeholder outside the human-judgement flags
  of the row it applies to. The detection only recognises a placeholder that shlex leaves as one argument beginning with <
  and ending with >. A placeholder of more than one word, such as <fill in owner name>, splits into <fill, in, owner and name>.
  None of those both starts with < and ends with >, so the action passes as admissible. An independent review found the gap
  after the X1 policy-exception repair (FC-024, FC-025). The same detection is used...
