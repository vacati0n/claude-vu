objective: 'Store the framework''s harvested lessons in the Open Knowledge Format (OKF) v0.2, published at https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md,
  instead of the single JSON document memory/lessons/lessons.store.json introduced by FC-022. Today every lesson lives in
  one framework-private JSON file (schema framework.memory/lessons.v1). Only runtime/knowledge.py can read it. It carries
  no provenance or trust metadata that a third party would understand, and it cannot be browsed, linked or reviewed as documents.
  OKF is an open, vendor-neutral format built for this: a directory of markdown concept documents with YAML frontmatter, plus
  reserved index.md and log.md fi...'
