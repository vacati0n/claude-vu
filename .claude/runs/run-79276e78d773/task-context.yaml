- 'TO-4: Every date and generated value in the bundle derives from lesson record fields, never from write time. Traces to
  BO-3. Verified by T-015.'
- 'TO-5: No lesson field value can alter the structure of a lesson document, the root index or the change log. Traces to BO-2
  and BO-3. Verified by T-016 and T-...'
- 'TO-6: The bundle path is excluded from the installed payload, the bundled mirror and the memory optimiser, and no other
  path is newly excluded. Traces to BO-...'
